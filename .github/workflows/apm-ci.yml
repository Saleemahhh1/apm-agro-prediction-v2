name: APM-Agro CI

on:
  push:
    branches: [apm-phase-8-auth-backend]
  pull_request:
    branches: [apm-phase-8-auth-backend]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
